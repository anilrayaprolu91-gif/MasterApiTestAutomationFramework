# =============================================================================
#  GitLab CI/CD — Master API Test Automation Framework
#
#  Stages : test → report
#  Image  : Eclipse Temurin 17 (Maven pre-installed via the maven:3.9-eclipse variant)
#  Caching: .m2/repository is cached between pipelines to speed up dependency resolution
#
#  Artifacts:
#    allure-results — raw JSON result files consumed by the report stage
#    allure-report  — generated HTML; browsable directly in GitLab's Browse button
#    logs           — framework log files for debugging
# =============================================================================

stages:
  - test
  - report

# ---------------------------------------------------------------------------
#  Global variables available in all jobs
# ---------------------------------------------------------------------------
variables:
#  MAVEN_OPTS: >-
#    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
#    -Djava.awt.headless=true
#    -XX:+TieredCompilation
#    -XX:TieredStopAtLevel=1
#  ALLURE_RESULTS_DIR: target/allure-results
#  ALLURE_REPORT_DIR:  target/allure-report
#
## ---------------------------------------------------------------------------
##  Dependency cache shared across all jobs on the same branch
## ---------------------------------------------------------------------------
#.maven_cache: &maven_cache
#  cache:
#    key:
#      files:
#        - pom.xml
#    paths:
#      - .m2/repository
#    policy: pull-push
#
## ---------------------------------------------------------------------------
##  Stage: test
## ---------------------------------------------------------------------------
run-api-tests:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  <<: *maven_cache

  script:
    - echo "Java version:"; java -version
    - echo "Maven version:"; mvn -version
    - echo "Running API test suite..."
    - mvn -B --no-transfer-progress test

  artifacts:
    name: "test-artifacts-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    when: always    # Save artifacts even if tests fail — critical for failure analysis
    expire_in: 30 days
    paths:
      - $ALLURE_RESULTS_DIR
      - target/logs
      - target/surefire-reports

  # Surface TestNG XML results natively in GitLab's Test Reports UI
  reports:
    junit:
      - target/surefire-reports/TEST-*.xml

  # Only run on merge requests targeting main/develop, or direct pushes to those branches
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "web"'     # Manual pipeline trigger

# ---------------------------------------------------------------------------
#  Stage: report  — generate and publish Allure HTML
# ---------------------------------------------------------------------------
generate-allure-report:
  stage: report
  image: frankescobar/allure-docker-service:2.27.0
  needs:
    - job: run-api-tests
      artifacts: true

  script:
    - echo "Generating Allure report from results in $ALLURE_RESULTS_DIR..."
    - allure generate "$ALLURE_RESULTS_DIR" --clean -o "$ALLURE_REPORT_DIR"
    - echo "Report generated successfully at $ALLURE_REPORT_DIR"

  artifacts:
    name: "allure-report-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 30 days
    paths:
      - $ALLURE_REPORT_DIR
    expose_as: "Allure Report"   # Adds a direct link in the MR sidebar

  # Publish only from the main branch so only verified results are indexed
  environment:
    name: allure-report/$CI_COMMIT_REF_SLUG
    url: $CI_PAGES_URL

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ---------------------------------------------------------------------------
#  GitLab Pages — serves the Allure report at https://<namespace>.gitlab.io/<project>
#  Note: rename the job to "pages" to enable GitLab Pages auto-deployment.
# ---------------------------------------------------------------------------
pages:
  stage: report
  needs:
    - job: generate-allure-report
      artifacts: true
  script:
    - mkdir -p public
    - cp -r "$ALLURE_REPORT_DIR/." public/
    - echo "Allure report deployed to GitLab Pages."
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

